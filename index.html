<body>
  <!-- App Wrapper -->
  <div class="app">

    <!-- Top Bar -->
    <header class="top-bar">
      <h1 class="app-title">Pause</h1>

      <button class="memory-btn">
  <i class="ri-book-open-line"></i>
</button>
      <button class="profile-btn">
        <i class="ri-user-3-line"></i>
      </button>
    </header>

    <!-- Main Content -->
    <main class="main">
      <section class="card">
        <h2>How are you feeling today?</h2>
        <p>Take a breath. Write it out. Save it.</p>

        <button class="primary-btn">
          Start writing
        </button>
      </section>
    </main>
</div>
<!-- Writing Panel -->
<div class="write-panel hidden">
  <div class="panel-header">
    <h3>Write freely</h3>
    <button class="close-btn">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <textarea
    placeholder="Type whatever you’re feeling…"
  ></textarea>

  <button class="save-btn">Save entry</button>
</div>

<!-- Memory Panel -->
<div class="memory-panel hidden">
  <div class="panel-header">
    <h3>Your entries</h3>
    <button class="close-memory">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <div class="entries"></div>
</div>
<script src="script.js"></script>
</body>
